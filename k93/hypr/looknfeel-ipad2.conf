    # column_width = 0.97
}

# iPad 2: Hyprland draws with llvmpipe on two Cortex-A9s, so every effect
# that costs a full-screen pass is off.
animations {
    enabled = false
}
decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
misc {
    vfr = true
}
